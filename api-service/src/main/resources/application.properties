spring.application.name=api-service
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/modelforge
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App
server.port=8080
spring.application.name=modelforge-api
# JWT
jwt.secret=modelforge-super-secret-key-change-this-in-production-minimum-32-chars
jwt.expiration=604800000

spring.jpa.open-in-view=false

modelforge.upload-dir=uploads
modelforge.fastapi-url=http://localhost:8000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# logging.level.org.springframework.security=DEBUG